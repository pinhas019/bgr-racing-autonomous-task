# Two containers on one bridge network; DDS discovers peers via multicast on it.
# Run:  docker compose up --build   → results in ./output. Both containers exit by themselves when done.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: "42"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp

services:
  producer:
    build: ./producer
    environment: *ros-env
    restart: on-failure:3   # crash -> restart; it re-publishes its latched data to the consumer

  consumer:
    build: ./consumer
    environment: *ros-env
    volumes:
      - ./output:/output
    depends_on: [producer]
