# All consumer pipeline settings. Nodes have no defaults in code: a missing key is a startup error.
/**:
  ros__parameters:
    deadline_s: 180.0     # every node gives up after this long (upstream lost / never arrived)

# ---- planning: the same three nodes run in two namespaces --------------------------------------------
# /track: Brands Hatch map, closed lap, GT-like car
/track/centerline_node:
  ros__parameters:
    closed: true
    interpolation: "cubic"  # map polygon -> smooth spline through its points
    n_samples: 500        # centerline points handed to the rest of the pipeline (~7.8 m spacing)
    n_dense: 5000         # boundary resampling density used for nearest-point matching

/track/raceline_node:
  ros__parameters:
    closed: true
    jacobian: "sparse"    # 500 points: sparse 7 s vs dense 41 s (measured)
    margin: 1.0           # [m] minimum distance kept from each boundary
    avoid_obstacles: true # pass every LiDAR obstacle placed on the map (obstacle_map_node) at >= margin

/track/speed_profile_node:
  ros__parameters:        # point-mass vehicle, roughly a GT car
    closed: true
    a_lat: 15.0           # [m/s^2] max lateral acceleration
    a_acc: 8.0            # [m/s^2] max longitudinal acceleration
    a_brk: 12.0           # [m/s^2] max braking deceleration
    v_top: 70.0           # [m/s]   top speed

# /cones: boundaries built from the LiDAR cones, open path ahead of the car, Formula Student car
/cones/centerline_node:
  ros__parameters:
    closed: false
    interpolation: "linear" # a cone track's edges are straight lines between cones
    n_samples: 120        # ~0.3 m spacing on a ~35 m path
    n_dense: 1000

/cones/raceline_node:
  ros__parameters:
    closed: false
    jacobian: "dense"     # 120 points: dense 0.5 s vs sparse 84 s (measured)
    margin: 1.0           # [m] half the car width (~0.7 m) plus a safety gap
    avoid_obstacles: false # the cone corridor is already built from the obstacles that matter (the cones)

/cones/speed_profile_node:
  ros__parameters:        # point-mass vehicle, roughly a Formula Student car
    closed: false
    a_lat: 15.0           # [m/s^2]
    a_acc: 8.0            # [m/s^2]
    a_brk: 12.0           # [m/s^2]
    v_top: 30.0           # [m/s]
    v_start: 0.0          # [m/s] speed where the path begins: one frame has no ego speed -> standing start

# ---- perception ---------------------------------------------------------------------------------------
lidar_ground_node:
  ros__parameters:
    max_pfa: 0.001        # returns with a higher probability of false alarm are set aside
    fit_range: 40.0       # [m] ground plane is fitted to returns within this horizontal range
    robust_scale: 0.05    # [m] Cauchy loss scale: residuals much larger than this barely count
    ground_tol: 0.15      # [m] height above the plane still counted as ground
    max_height: 3.0       # [m] above this: overhead (signs, trees), not an obstacle

lidar_cluster_node:
  ros__parameters:
    radius: 0.5           # [m] points closer than this belong to the same object
    min_points: 5         # smaller groups are treated as noise
    cone_max_footprint: 0.5   # [m] cone candidate: max(size_x, size_y) at most this
    cone_min_height: 0.15     # [m] ... and top height above ground in this range
    cone_max_height: 0.8      #     (FS cones: 0.325 m small, 0.505 m large)

obstacle_map_node:
  ros__parameters:        # ASSUMPTION: one LiDAR frame has no GPS pose; place it on the Brands Hatch map
    anchor_s_m: 0.0       # [m] the car stands on the centerline this far after the start, facing along the track
    max_range: 60.0       # [m] obstacle points farther than this from the sensor are not placed

cone_track_node:
  ros__parameters:        # LiDAR cones -> left / right boundaries (no colour: geometry only)
    track_cone_min_height: 0.20   # [m] cones marking the track: small FS cones (0.325 m tall)
    track_cone_max_height: 0.40
    gate_min_width: 3.0   # [m] a gate (one cone each side) is about one track width: FS minimum is 3 m
    gate_max_width: 7.0
    max_step: 16.0        # [m] max distance to the next gate (allows a few missing / hidden cones)
    max_turn_deg: 60.0    # the next gate must lie within this angle of the current heading
    max_gate_skew_deg: 50.0   # a gate must lie across the travel direction, within this angle of perpendicular
    min_gates: 3          # fewer gates than this: no cone track in the frame -> error

# ---- report ---------------------------------------------------------------------------------------------
report_node:
  ros__parameters:
    track_name: "Brands Hatch"
    corner_drop_kmh: 15.0 # a speed dip at least this deep counts as a corner (labelled in track_speed.png)
    scan_zones: 4         # LiDAR rows are 4 azimuth zones stacked; stitched side by side for the scan plot
    bev_zoom_range: 35.0  # [m] zoomed bird's-eye view
    output_dir: "/output"
    ack_timeout_s: 3.0    # max wait for all nodes to acknowledge the final pipeline status (live nodes ack in ms;
                          # a hard-killed node stays registered in DDS until its lease expires)
